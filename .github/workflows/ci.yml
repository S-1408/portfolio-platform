name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per PR/branch; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  # Optional Vercel Remote Cache (see docs/deployment.md). Empty = local cache only.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: Lint, typecheck, test, build, e2e, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so turbo can diff against origin/main.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # version comes from "packageManager"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/portfolio/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Select affected packages
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Changed packages plus everything that depends on them.
            filter='--filter=...[origin/${{ github.base_ref }}]'
          else
            filter=''
          fi
          echo "filter=$filter" >> "$GITHUB_OUTPUT"

          # Does this change touch the portfolio app (directly or via a dependency)?
          affected=$(pnpm exec turbo run build $filter --dry=json | jq -r '.packages[]')
          echo "Affected packages:"; echo "$affected"
          if echo "$affected" | grep -qx '@repo/portfolio'; then
            echo "portfolio=true" >> "$GITHUB_OUTPUT"
          else
            echo "portfolio=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint, typecheck, test, build
        run: pnpm exec turbo run lint typecheck test build ${{ steps.scope.outputs.filter }}

      - name: Install Playwright browser
        if: steps.scope.outputs.portfolio == 'true'
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests (Playwright + axe)
        if: steps.scope.outputs.portfolio == 'true'
        # Build outputs come from the turbo cache populated by the previous step.
        run: pnpm exec turbo run e2e --filter=@repo/e2e

      - name: Upload Playwright report
        if: failure() && steps.scope.outputs.portfolio == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

      - name: Lighthouse CI
        if: steps.scope.outputs.portfolio == 'true'
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: always() && steps.scope.outputs.portfolio == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14
